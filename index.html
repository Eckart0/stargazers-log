<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred software repositories.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">A collection of useful code</p>
      <h1>Stargazers log</h1>
      <p class="intro">A log of the repositories I've starred.</p>
      <p id="status" class="status" role="status" aria-live="polite">Loading starred repositories…</p>
      <ul id="repositories" class="repo-list" aria-label="Starred repositories"></ul>
    </main>
    <script src="./script.js" defer></script>
  </body>
</html>
